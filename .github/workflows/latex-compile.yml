name: Compile LaTeX

on:
  push:
    branches:
      - main  # Change to 'master' if that is your default branch
    paths:
      - '**.tex'  # Only runs when a .tex file is modified

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile all LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          
      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update PDF from LaTeX"
          file_pattern: '*.pdf'
