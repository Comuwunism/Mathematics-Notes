name: Compile LaTeX

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find all LaTeX files
        id: find_tex
        run: |
          FILES=$(find . -name "*.tex" -type f -printf '"%P"\n')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Compile all discovered files
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ steps.find_tex.outputs.files }}
          work_in_root_file_dir: true
          
      - name: Commit generated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile all LaTeX documents"
          file_pattern: '**/*.pdf'
